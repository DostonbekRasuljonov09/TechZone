{% extends 'base.html' %}

{% block title %}Kirish - Portfolio{% endblock %}

{% block main %}
<div class="flex-1 flex flex-col justify-center items-center px-4 relative mt-16 pb-12">
    <div class="absolute inset-0 z-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1607705703571-c5a8695f18f6?auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center"></div>
    <div class="absolute inset-0 z-0 bg-gradient-to-t from-dark-900 via-dark-900/90 to-dark-900/70"></div>

    <div class="glass-card rounded-3xl p-8 md:p-10 w-full max-w-md relative z-10 border border-primary-500/20 shadow-2xl shadow-primary-500/10 backdrop-blur-xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-primary-500 text-3xl shadow-inner border border-primary-500/30">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Xush kelibsiz!</h1>
            <p class="text-gray-400 text-sm">Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-xl mb-5">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-user text-gray-500"></i></div>
                    <input type="text" name="username" required
                        class="w-full bg-dark-800/50 border border-white/10 rounded-xl pl-10 px-4 py-3 text-white focus:outline-none focus:border-primary-500 focus:bg-dark-800 transition shadow-inner"
                        placeholder="username">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Parol</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-lock text-gray-500"></i></div>
                    <input type="password" name="password" required
                        class="w-full bg-dark-800/50 border border-white/10 rounded-xl pl-10 px-4 py-3 text-white focus:outline-none focus:border-primary-500 focus:bg-dark-800 transition shadow-inner"
                        placeholder="••••••••">
                </div>
            </div>
            <div class="pt-2">
                <button type="submit"
                    class="w-full bg-primary-500 hover:bg-primary-600 text-white rounded-xl py-3.5 font-bold text-lg transition shadow-lg shadow-primary-500/30 flex items-center justify-center gap-2">
                    Kirish <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-sm text-gray-400 border-t border-white/10 pt-6">
            Hisobingiz yo'qmi?
            <a href="{% url 'register' %}" class="text-primary-500 hover:text-white font-bold transition ml-1">Ro'yxatdan o'tish</a>
        </div>
    </div>
</div>
{% endblock %}
